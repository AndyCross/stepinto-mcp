name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # No key and no network beyond the module proxy: the model's side is
      # replayed from testdata/recordings and the site from testdata/site.
      - run: go test ./...
